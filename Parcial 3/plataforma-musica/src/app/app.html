  (seleccionarCancion)="onCancionSeleccionada($event)"
  (insertarCancion)="onInsertarCancion($event)"
/>

<app-panel-ranking
  [topCanciones]="topCanciones"

/>

<app-grafo
  [cancionBase]="cancionSeleccionada"

  [catalogo]="catalogo"
  (cancionSeleccionada)="onCancionSeleccionada($event)"

/>
