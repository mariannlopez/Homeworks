<input
  type="text"
  placeholder="Busca un GIF..."
  [(ngModel)]="termino"
  (input)="onInput()"
/>

@if (giphy.cargando()) {
  <p>Cargando...</p>
}

@if (giphy.error()) {
  <p class="error">{{ giphy.error() }}</p>
}

@if (!giphy.cargando() && !giphy.error() && termino && giphy.gifs().length === 0) {
  <p>No se encontraron GIFs.</p>
}

<div class="grid">
  @for (gif of giphy.gifs(); track gif.id) {
    <img [src]="gif.images.fixed_height.url" [alt]="gif.title" />
  }
</div>
