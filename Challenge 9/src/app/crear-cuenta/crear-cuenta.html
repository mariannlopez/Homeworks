<div class="register-container">
    <h2>Registro</h2>

    <div>
        <input type="email"
            placeholder="Email"
            [ngModel]="email()"
            (ngModelChange)="email.set($event)"
        >
    </div>
    <div>
        <input type="password"
            placeholder="Contraseña"
            [ngModel]="contrasena()"
            (ngModelChange)="contrasena.set($event)"
        >
    </div>
    <div>
        <button type="button" (click)="handleRegister()">
            Crear Cuenta
        </button>
    </div>
    <div class="routes">
        <a routerLink="/inicio">Inicia Sesion</a>
    </div>
</div>
