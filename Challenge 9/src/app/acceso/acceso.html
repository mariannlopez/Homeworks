<main>
    <div>
        <h1>Iniciar Sesión</h1>
        <form>
            <div class="login-container">
                <div class="correo-container">
                    <input 
                        type="email" 
                        name="email"
                        placeholder="correo electrónico"
                        [ngModel]="email()"
                        (ngModelChange)="email.set($event)"
                    >
                </div>
                <div class="contraseña-container">
                    <input 
                        type="password" 
                        name="contrasena"
                        placeholder="Contraseña"
                        [ngModel]="contrasena()"
                        (ngModelChange)="contrasena.set($event)"
                    >
                </div>
                <div class="boton">
                    <button type="submit" (click)="handleLogin()">Enviar</button>
                </div>
            </div>
            <div class="rutas">
                <a routerLink="/registro"
                routerLinkActive="activo">Registrarse</a>
            </div>
        </form>
    </div>
</main>
